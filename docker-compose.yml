version: "3.9"

# Local development stack — mirrors the production topology (Neon Postgres w/ pgvector,
# Upstash Redis) so the whole platform runs with zero cloud accounts. See docs/deployment.md.
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: resolution-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: resolution
    ports:
      - "5432:5432"
    volumes:
      - resolution_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: resolution-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - resolution_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  resolution_postgres_data:
  resolution_redis_data:
