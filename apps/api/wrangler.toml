name = "resolution-api"
main = "src/worker.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# D1 database — see docs/deployment.md. Migrations live in
# packages/database/prisma/migrations and are applied via:
#   npx wrangler d1 execute resolution-db --remote --file=<migration>.sql
[[d1_databases]]
binding = "DB"
database_name = "resolution-db"
database_id = "2c18552b-e3e5-4852-8d50-c71c79465890"

# Cloudflare Queues — ARCHITECTURE.md §10. Webhook routes (POST /api/webhooks/jira|
# servicenow) enqueue onto incident-ingestion and return immediately; its consumer
# (apps/api/src/worker.ts's `queue` export) does the actual ingestion work, then itself
# enqueues onto incident-investigation for Phase 7's Investigation/RCA agent, whose consumer
# in turn enqueues onto incident-remediation for Phase 8's Resolution/Verification pipeline
# on a successful RCA. One Worker script consumes all three — worker.ts dispatches on
# `batch.queue`, see its header comment. Dead-letter queues catch messages that exhaust
# max_retries so they're inspectable rather than silently dropped.
#
# Safe by default even with MOCK_MODE=false in this deployment's [vars] below: an
# incident-remediation message can only ever reach real, unattended execution
# (packages/agents/policy-engine.ts's AUTO behavior) if an org has both (a) explicitly
# switched its resolutionMode off OBSERVE_ONLY (the default for every org) and (b)
# configured an AUTO AutomationPolicy for that exact capability — the DEFAULT_POLICY every
# unconfigured capability falls back to never auto-executes.
[[queues.producers]]
queue = "resolution-incident-ingestion"
binding = "INCIDENT_INGESTION_QUEUE"

[[queues.producers]]
queue = "resolution-incident-investigation"
binding = "INCIDENT_INVESTIGATION_QUEUE"

[[queues.producers]]
queue = "resolution-incident-remediation"
binding = "INCIDENT_REMEDIATION_QUEUE"

[[queues.consumers]]
queue = "resolution-incident-ingestion"
max_batch_size = 10
max_retries = 3
dead_letter_queue = "resolution-incident-ingestion-dlq"

[[queues.consumers]]
queue = "resolution-incident-investigation"
# Small batches, few retries — each message drives a real (possibly billed) LLM
# investigation loop; a batch of 10 would mean 10 concurrent investigations per invocation,
# and 3 retries of a genuinely-failing investigation is enough to catch a transient error
# without repeatedly re-running an expensive agent loop against a bad message.
max_batch_size = 3
max_retries = 2
dead_letter_queue = "resolution-incident-investigation-dlq"

[[queues.consumers]]
queue = "resolution-incident-remediation"
# Same reasoning as incident-investigation, plus: a remediation message can call a real
# *mutating* capability (if policy allows AUTO), so re-running one on retry must never
# happen more than a couple of times — a genuinely broken remediation should land on the
# DLQ for a human, not keep re-executing a mutating action against a real system.
max_batch_size = 3
max_retries = 2
dead_letter_queue = "resolution-incident-remediation-dlq"

# Plain (non-secret) config — safe to commit. JWT_SECRET, ENCRYPTION_MASTER_KEY and
# ANTHROPIC_API_KEY are set via `wrangler secret put` instead (encrypted server-side, never
# written to this file).
[vars]
NODE_ENV = "production"
CORS_ORIGIN = "https://resolution-a7j.pages.dev"
SECRET_PROVIDER = "ENCRYPTED_DB"
MOCK_MODE = "false"
ANTHROPIC_MODEL = "claude-opus-5"
